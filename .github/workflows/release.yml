name: Build & Release

# A ogni push o merge su main: build per Windows (.msi), macOS (.dmg Intel + Apple Silicon)
# e Linux (.AppImage), poi pubblicazione automatica di una GitHub Release installabile.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Calcola versione
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Versione = major.minor da package.json + numero di build
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Modelli AI (GitHub Release models-v1)
        run: npm run models
      - run: npm run check
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSI)
            os: windows-latest
            args: --win msi --x64
            files: dist/*.msi
          - name: macOS (DMG)
            os: macos-latest
            args: --mac dmg --x64 --arm64
            files: dist/*.dmg
          - name: Linux (AppImage)
            os: ubuntu-latest
            args: --linux AppImage --x64
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Modelli AI (GitHub Release models-v1)
        run: npm run models
      - name: Imposta versione ${{ needs.version.outputs.version }}
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Pacchetto installabile
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Pubblica GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Copie con nome fisso (link "ultima versione" usati dal sito)
        run: |
          cd installers
          for f in *; do
            stable=$(echo "$f" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+-/-/')
            [ "$stable" != "$f" ] && cp "$f" "$stable"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Segueo v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Installazione
            - **Windows**: scarica `Segueo-${{ needs.version.outputs.version }}-win-x64.msi` e fai doppio clic.
            - **macOS Apple Silicon (M1/M2/M3/M4)**: `…-mac-arm64.dmg` · **macOS Intel**: `…-mac-x64.dmg`.
              L'app non è firmata da Apple: al primo avvio fai clic destro sull'app → **Apri**, oppure esegui
              `xattr -cr "/Applications/Segueo.app"` nel Terminale.
            - **Linux**: scarica l'`.AppImage`, rendilo eseguibile (`chmod +x`) e avvialo.
          files: installers/*
