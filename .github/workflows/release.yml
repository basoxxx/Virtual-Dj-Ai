name: Build & Release

# A ogni push o merge su main: build per Windows (.msi), macOS (.dmg Intel + Apple Silicon)
# e Linux (.AppImage), poi pubblicazione automatica di una GitHub Release installabile.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Calcola versione
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Versione = major.minor da package.json + numero di build
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Modelli AI (GitHub Release models-v1)
        run: npm run models
      - run: npm run check
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSI)
            os: windows-latest
            args: --win msi --x64
            files: dist/*.msi
          - name: macOS (DMG)
            os: macos-latest
            args: --mac dmg --x64 --arm64
            files: dist/*.dmg
          - name: Linux (AppImage)
            os: ubuntu-latest
            args: --linux AppImage --x64
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Modelli AI (GitHub Release models-v1)
        run: npm run models
      - name: Imposta versione ${{ needs.version.outputs.version }}
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Pacchetto installabile
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Firma Windows gratuita (SignPath Foundation, vedi docs/firma-codice.md): attiva solo quando il
      # secret SIGNPATH_API_TOKEN esiste, altrimenti l'MSI esce non firmato come prima.
      - name: MSI da firmare
        id: unsigned
        if: matrix.os == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 1
      - name: Firma con SignPath (Segueo.exe dentro l'MSI e l'MSI stesso)
        if: matrix.os == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Virtual-Dj-Ai' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'msi' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # la firma di rilascio va approvata a mano su app.signpath.io: un'ora per farlo
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Sostituisce l'MSI con quello firmato
        if: matrix.os == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter *.msi
          if (-not $signed) { throw "SignPath non ha restituito nessun MSI firmato" }
          Remove-Item dist/*.msi
          $signed | Copy-Item -Destination dist
          $sig = Get-AuthenticodeSignature (Get-ChildItem dist/*.msi)
          if ($sig.Status -ne 'Valid') { throw "Firma dell'MSI non valida: $($sig.Status)" }
          "Firmato da: $($sig.SignerCertificate.Subject)"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Pubblica GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      - name: Copie con nome fisso (link "ultima versione" usati dal sito)
        run: |
          cd installers
          for f in *; do
            stable=$(echo "$f" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+-/-/')
            [ "$stable" != "$f" ] && cp "$f" "$stable"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Segueo v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Installazione
            - **Windows**: scarica `Segueo-${{ needs.version.outputs.version }}-win-x64.msi` e fai doppio clic.
              Se compare «Windows ha protetto il PC», fai clic su **Ulteriori informazioni** → **Esegui comunque**.
            - **macOS Apple Silicon (M1/M2/M3/M4)**: `…-mac-arm64.dmg` · **macOS Intel**: `…-mac-x64.dmg`.
              L'app non è firmata da Apple: se al primo avvio macOS la blocca, vai in **Impostazioni di Sistema →
              Privacy e sicurezza** e premi **Apri comunque**, oppure esegui `xattr -cr "/Applications/Segueo.app"` nel Terminale.
            - **Linux**: scarica l'`.AppImage`, rendilo eseguibile (`chmod +x`) e avvialo.
          files: installers/*
