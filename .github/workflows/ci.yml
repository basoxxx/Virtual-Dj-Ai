name: CI

# Sui branch e sulle pull request: test + build di prova degli installer
# (scaricabili come artifact del workflow, senza creare una release).
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Modelli AI (GitHub Release models-v1)
        run: npm run models
      - run: npm run check
      - run: npm test

  package:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSI)
            os: windows-latest
            args: --win msi --x64
            files: dist/*.msi
          - name: macOS (DMG)
            os: macos-latest
            args: --mac dmg --x64 --arm64
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Modelli AI (GitHub Release models-v1)
        run: npm run models
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
